<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1f3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#pcbBg)"/>

  <!-- Moniteur -->
  <g transform="translate(200, 180)">
    <!-- Écran -->
    <rect x="-110" y="-80" width="220" height="140" rx="6" fill="#2a3a5c" stroke="#4a5a7c" stroke-width="2"/>
    <!-- Intérieur écran -->
    <rect x="-104" y="-74" width="208" height="128" rx="2" fill="url(#screenGrad)"/>
    <!-- Barre de tâches haut -->
    <rect x="-104" y="-74" width="208" height="14" fill="#0a1f3a"/>
    <circle cx="-95" cy="-67" r="2.5" fill="#ef4444"/>
    <circle cx="-86" cy="-67" r="2.5" fill="#fbbf24"/>
    <circle cx="-77" cy="-67" r="2.5" fill="#22c55e"/>
    <!-- Contenu écran (fausse fenêtre) -->
    <rect x="-90" y="-52" width="85" height="50" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="-85" y="-46" width="60" height="3" fill="#fff" opacity="0.4"/>
    <rect x="-85" y="-38" width="70" height="3" fill="#fff" opacity="0.3"/>
    <rect x="-85" y="-30" width="45" height="3" fill="#fff" opacity="0.3"/>
    <rect x="-85" y="-22" width="55" height="3" fill="#fff" opacity="0.3"/>
    <rect x="15" y="-52" width="75" height="100" rx="3" fill="#fff" opacity="0.1"/>
    <rect x="20" y="-46" width="60" height="2" fill="#fff" opacity="0.4"/>
    <rect x="20" y="-40" width="50" height="2" fill="#fff" opacity="0.3"/>
    <rect x="20" y="-34" width="55" height="2" fill="#fff" opacity="0.3"/>
    <rect x="20" y="-28" width="40" height="2" fill="#fff" opacity="0.3"/>
    <!-- Pied moniteur -->
    <path d="M -20 60 L 20 60 L 25 80 L -25 80 Z" fill="#4a5a7c"/>
    <rect x="-45" y="78" width="90" height="6" rx="3" fill="#4a5a7c"/>
  </g>

  <!-- Clavier -->
  <g transform="translate(200, 300)">
    <rect x="-100" y="-12" width="200" height="24" rx="4" fill="#2a3a5c"/>
    <rect x="-95" y="-9" width="190" height="18" rx="2" fill="#1a2b4b"/>
    <!-- Touches -->
    <g fill="#3a4a6c">
      <rect x="-92" y="-7" width="10" height="4" rx="1"/>
      <rect x="-80" y="-7" width="10" height="4" rx="1"/>
      <rect x="-68" y="-7" width="10" height="4" rx="1"/>
      <rect x="-56" y="-7" width="10" height="4" rx="1"/>
      <rect x="-44" y="-7" width="10" height="4" rx="1"/>
      <rect x="-32" y="-7" width="10" height="4" rx="1"/>
      <rect x="-20" y="-7" width="10" height="4" rx="1"/>
      <rect x="-8" y="-7" width="10" height="4" rx="1"/>
      <rect x="4" y="-7" width="10" height="4" rx="1"/>
      <rect x="16" y="-7" width="10" height="4" rx="1"/>
      <rect x="28" y="-7" width="10" height="4" rx="1"/>
      <rect x="40" y="-7" width="10" height="4" rx="1"/>
      <rect x="52" y="-7" width="10" height="4" rx="1"/>
      <rect x="64" y="-7" width="10" height="4" rx="1"/>
      <rect x="76" y="-7" width="10" height="4" rx="1"/>
      <rect x="-40" y="1" width="80" height="5" rx="1"/>
    </g>
  </g>

  <!-- Souris -->
  <g transform="translate(320, 300)">
    <ellipse cx="0" cy="0" rx="15" ry="22" fill="#2a3a5c"/>
    <line x1="0" y1="-20" x2="0" y2="-5" stroke="#4a5a7c" stroke-width="1.5"/>
    <circle cx="0" cy="-10" r="2" fill="#4a5a7c"/>
  </g>

  <text x="200" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="#1a2b4b" text-anchor="middle" letter-spacing="4" opacity="0.7">
    PC BUREAUTIQUE
  </text>
</svg>
