<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="chBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <radialGradient id="chGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#chBg)"/>
  <circle cx="200" cy="200" r="140" fill="url(#chGlow)"/>

  <!-- Chargeur -->
  <g transform="translate(200, 180)">
    <!-- Bloc chargeur -->
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#fff" stroke="#1a2b4b" stroke-width="2"/>
    <!-- Prises -->
    <rect x="-22" y="-55" width="8" height="20" rx="1" fill="#1a2b4b"/>
    <rect x="-4" y="-55" width="8" height="20" rx="1" fill="#1a2b4b"/>
    <rect x="14" y="-55" width="8" height="20" rx="1" fill="#1a2b4b"/>
    <!-- Prise sortie USB-C -->
    <rect x="-10" y="35" width="20" height="6" rx="1" fill="#1a2b4b"/>
    <!-- LED -->
    <circle cx="0" cy="0" r="8" fill="#22c55e" opacity="0.9"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <!-- Éclair -->
    <path d="M -3 -8 L -6 2 L -1 2 L -3 10 L 5 -2 L 0 -2 L 3 -10 Z" fill="#fff"/>
    <!-- Texte W -->
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="10" font-weight="800"
          fill="#1a2b4b" text-anchor="middle">FAST CHARGE</text>
  </g>

  <!-- Câble -->
  <path d="M 200 220 Q 150 280 220 300 T 280 340" stroke="#fff" stroke-width="8" fill="none"/>
  <path d="M 200 220 Q 150 280 220 300 T 280 340" stroke="#94a3b8" stroke-width="6" fill="none"/>
  <!-- Embout USB-C -->
  <g transform="translate(280, 340)">
    <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#1a2b4b"/>
    <rect x="-7" y="-5" width="14" height="10" rx="2" fill="#fff"/>
  </g>

  <text x="200" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="#1a2b4b" text-anchor="middle" letter-spacing="4" opacity="0.7">
    CHARGEUR USB-C
  </text>
</svg>
