<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGarage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1f3a"/>
    </linearGradient>
    <linearGradient id="accentGarage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGarage)"/>

  <!-- Décor diagonal -->
  <polygon points="0,0 140,0 80,300 0,300" fill="url(#accentGarage)" opacity="0.15"/>
  <polygon points="400,0 400,120 320,0" fill="#fff" opacity="0.06"/>

  <!-- Voiture stylisée -->
  <g transform="translate(200, 140)">
    <!-- Carrosserie -->
    <path d="M -70 0 Q -68 -18 -50 -22 L -20 -32 Q 0 -36 20 -32 L 50 -22 Q 68 -18 70 0 L 70 15 Q 70 22 63 22 L -63 22 Q -70 22 -70 15 Z"
          fill="url(#accentGarage)" stroke="#fff" stroke-width="2"/>
    <!-- Vitres -->
    <path d="M -42 -20 L -20 -28 Q 0 -32 20 -28 L 42 -20 L 40 -5 L -40 -5 Z"
          fill="#87ceeb" opacity="0.9"/>
    <line x1="0" y1="-30" x2="0" y2="-5" stroke="url(#bgGarage)" stroke-width="1.5"/>
    <!-- Roues -->
    <circle cx="-42" cy="22" r="13" fill="#1a1a1a" stroke="#fff" stroke-width="2"/>
    <circle cx="-42" cy="22" r="5" fill="#d1d5db"/>
    <circle cx="42" cy="22" r="13" fill="#1a1a1a" stroke="#fff" stroke-width="2"/>
    <circle cx="42" cy="22" r="5" fill="#d1d5db"/>
    <!-- Phare -->
    <circle cx="60" cy="-2" r="4" fill="#fff" opacity="0.95"/>
  </g>

  <!-- Icône clé à molette -->
  <g transform="translate(60, 70) rotate(-30)">
    <rect x="-3" y="-25" width="6" height="40" fill="#fff" opacity="0.85" rx="2"/>
    <circle cx="0" cy="-28" r="9" fill="none" stroke="#fff" stroke-width="4" opacity="0.85"/>
    <circle cx="0" cy="20" r="7" fill="#fff" opacity="0.85"/>
  </g>

  <!-- Texte -->
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="900"
        fill="#fff" text-anchor="middle" letter-spacing="1">GARAGE SUD</text>
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="18" font-weight="600"
        fill="url(#accentGarage)" text-anchor="middle" letter-spacing="3">MÉDITERRANÉE</text>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="400"
        fill="#cbd5e1" text-anchor="middle" letter-spacing="2">— PÉLISSANNE —</text>
</svg>
