<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pcgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1030"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="pcgRGB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00aa"/>
      <stop offset="33%" stop-color="#aa00ff"/>
      <stop offset="66%" stop-color="#00aaff"/>
      <stop offset="100%" stop-color="#00ffaa"/>
    </linearGradient>
    <radialGradient id="pcgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff00aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff00aa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#pcgBg)"/>
  <circle cx="200" cy="200" r="180" fill="url(#pcgGlow)"/>

  <!-- Tour PC verticale -->
  <g transform="translate(200, 200)">
    <!-- Corps tour -->
    <rect x="-70" y="-110" width="140" height="220" rx="8" fill="#1a1a2e" stroke="#3a3a5c" stroke-width="2"/>
    <!-- Vitre latérale -->
    <rect x="-58" y="-95" width="116" height="160" rx="4" fill="#0a0a1a" opacity="0.7"/>
    <!-- Bande RGB haut -->
    <rect x="-58" y="-95" width="116" height="4" fill="url(#pcgRGB)"/>
    <!-- Bande RGB bas -->
    <rect x="-58" y="61" width="116" height="4" fill="url(#pcgRGB)"/>
    <!-- Ventilateur 1 -->
    <circle cx="-20" cy="-50" r="22" fill="#0f0f1f" stroke="#ff00aa" stroke-width="1.5"/>
    <circle cx="-20" cy="-50" r="18" fill="none" stroke="#ff00aa" stroke-width="0.8" opacity="0.6"/>
    <g transform="translate(-20, -50)">
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#ff00aa" opacity="0.8"/>
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#ff00aa" opacity="0.8" transform="rotate(120)"/>
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#ff00aa" opacity="0.8" transform="rotate(240)"/>
    </g>
    <!-- Ventilateur 2 -->
    <circle cx="-20" cy="10" r="22" fill="#0f0f1f" stroke="#aa00ff" stroke-width="1.5"/>
    <circle cx="-20" cy="10" r="18" fill="none" stroke="#aa00ff" stroke-width="0.8" opacity="0.6"/>
    <g transform="translate(-20, 10) rotate(45)">
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#aa00ff" opacity="0.8"/>
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#aa00ff" opacity="0.8" transform="rotate(120)"/>
      <path d="M 0 -15 Q 5 -5 0 0 Q -5 5 -10 0 Q -15 -5 -5 -10 Z" fill="#aa00ff" opacity="0.8" transform="rotate(240)"/>
    </g>
    <!-- GPU (rectangle horizontal) -->
    <rect x="15" y="-30" width="42" height="12" fill="#2a2a3e" stroke="#00aaff" stroke-width="1"/>
    <line x1="24" y1="-27" x2="24" y2="-21" stroke="#00aaff" stroke-width="1.5"/>
    <line x1="34" y1="-27" x2="34" y2="-21" stroke="#00aaff" stroke-width="1.5"/>
    <line x1="44" y1="-27" x2="44" y2="-21" stroke="#00aaff" stroke-width="1.5"/>
    <!-- Barrettes RAM -->
    <rect x="15" y="-70" width="42" height="4" fill="#16a34a" opacity="0.7"/>
    <rect x="15" y="-62" width="42" height="4" fill="#16a34a" opacity="0.7"/>
    <!-- Bouton power -->
    <circle cx="0" cy="90" r="4" fill="#ff00aa"/>
    <circle cx="0" cy="90" r="7" fill="none" stroke="#ff00aa" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Icône gaming en bas -->
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="#fff" text-anchor="middle" letter-spacing="4" opacity="0.7">
    PC GAMING
  </text>
</svg>
