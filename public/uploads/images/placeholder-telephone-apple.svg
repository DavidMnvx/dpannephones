<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="teleBgApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="phoneApple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <linearGradient id="wallpaperApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#c471ed"/>
      <stop offset="100%" stop-color="#12c2e9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#teleBgApple)"/>

  <!-- Téléphone -->
  <g transform="translate(200, 200)">
    <!-- Corps -->
    <rect x="-60" y="-120" width="120" height="240" rx="22" fill="url(#phoneApple)"/>
    <rect x="-55" y="-115" width="110" height="230" rx="18" fill="#0a0a0a"/>
    <!-- Écran avec wallpaper -->
    <rect x="-50" y="-110" width="100" height="220" rx="14" fill="url(#wallpaperApple)"/>
    <!-- Dynamic Island -->
    <rect x="-18" y="-105" width="36" height="12" rx="6" fill="#000"/>
    <!-- Icônes app -->
    <g opacity="0.85">
      <rect x="-36" y="-60" width="16" height="16" rx="4" fill="#fff" opacity="0.95"/>
      <rect x="-16" y="-60" width="16" height="16" rx="4" fill="#22c55e"/>
      <rect x="4" y="-60" width="16" height="16" rx="4" fill="#3b82f6"/>
      <rect x="24" y="-60" width="16" height="16" rx="4" fill="#f59e0b"/>
      <rect x="-36" y="-40" width="16" height="16" rx="4" fill="#ef4444"/>
      <rect x="-16" y="-40" width="16" height="16" rx="4" fill="#8b5cf6"/>
      <rect x="4" y="-40" width="16" height="16" rx="4" fill="#ec4899"/>
      <rect x="24" y="-40" width="16" height="16" rx="4" fill="#06b6d4"/>
    </g>
    <!-- Barre du bas -->
    <rect x="-18" y="100" width="36" height="4" rx="2" fill="#fff" opacity="0.5"/>
    <!-- Boutons latéraux -->
    <rect x="-62" y="-50" width="2" height="18" fill="#48484a"/>
    <rect x="-62" y="-20" width="2" height="30" fill="#48484a"/>
    <rect x="60" y="-40" width="2" height="50" fill="#48484a"/>
  </g>

  <!-- Logo Apple simplifié (dégradé) -->
  <g transform="translate(60, 60)" opacity="0.15">
    <path d="M 10 0 Q 20 -2 20 10 Q 20 22 10 25 Q 0 22 0 10 Q 0 -2 10 0 Z M 10 -4 Q 12 -8 8 -8" fill="#1a1a1a"/>
  </g>

  <text x="200" y="380" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="#4a5568" text-anchor="middle" letter-spacing="4" opacity="0.7">
    iPHONE
  </text>
</svg>
