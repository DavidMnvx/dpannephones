framework:
    rate_limiter:
        # Limite les tentatives de login pour contrer le brute-force.
        # Symfony utilise ces limiters automatiquement quand `login_throttling`
        # est activé dans security.yaml.

        # Par identifiant (email) — évite qu'un attaquant cible un compte précis
        login:
            policy: token_bucket
            limit: 5
            rate: { interval: '15 minutes', amount: 5 }

        # Par IP — évite qu'un attaquant tente plusieurs comptes depuis la même IP
        # Typiquement 5× plus permissif que la limite par identifiant.
        login_ip:
            policy: sliding_window
            limit: 25
            interval: '15 minutes'

        # Soumission du formulaire contact — anti-spam.
        # Max 3 envois / IP / heure : largement suffisant pour un usage humain
        # (3 demandes différentes par heure depuis la même connexion).
        contact_submit:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Inscription compte client — anti-création massive de faux comptes.
        # Max 3 inscriptions / IP / heure (foyers partagés respectés).
        registration:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
