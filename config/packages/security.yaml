security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            user_checker: App\Security\UserChecker
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                csrf_token_id: authenticate
            logout:
                path: app_logout
                target: home
            entry_point: form_login

            # « Rester connecté » : uniquement si la case du formulaire est cochée.
            # Sans elle, la session expire à la fermeture du navigateur ou après
            # 2 h d'inactivité (framework.yaml) — important pour le back-office.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false

            # Protection anti brute-force sur le login :
            #  - max 5 tentatives ratées en 1 minute par IP
            #  - + max 5 tentatives ratées par compte/identifiant en 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    access_control:

        # Espace administration — ROLE_ADMIN requis
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Espace client — ROLE_USER requis
        - { path: ^/mon-compte, roles: ROLE_USER }
        - { path: ^/logout,     roles: ROLE_USER }
        - { path: ^/avis/laisser, roles: ROLE_USER }

        # Paiement / panier — pas de restriction (invité possible)
        # sauf checkout qui nécessite d'être connecté (mieux pour le suivi commande)
        - { path: ^/payment, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
